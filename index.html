<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Simpel</title>
    <style>
        /* Menghilangkan margin bawaan dan memastikan tinggi penuh */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            /* Menggunakan Flexbox untuk membuat teks tepat di tengah */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            
            /* Desain latar belakang (bisa diganti sesuai selera) */
            background: linear-gradient(135deg, #0f172a, #1e293b); 
            
            /* Font yang modern dan bersih */
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: #f8fafc;
            
            /* Mencegah scrollbar muncul jika tidak diperlukan */
            overflow: hidden; 
        }

        .text-tengah {
            /* Ukuran teks besar dan responsif (menyesuaikan layar) */
            font-size: clamp(2rem, 8vw, 5rem); 
            font-weight: 800;
            text-align: center;
            letter-spacing: -0.05em;
            padding: 20px;
            
            /* Efek gradasi pada teks agar terlihat lebih "mahal" */
            background: linear-gradient(to right, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            
            /* Animasi muncul perlahan (fade-in) */
            animation: fadeIn 1.5s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>

    <!-- Ganti teks di bawah ini dengan kalimat yang Anda inginkan -->
    <h1 class="text-tengah">YANG BUKA KAYA ANJING.</h1>

</body>
</html>
