<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Luxury Text</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    height:100vh;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    background:
    radial-gradient(circle at top left,#2d1b69,#0f0f0f 40%),
    radial-gradient(circle at bottom right,#ffb30022,#000 50%);
    position:relative;
}

/* Blur glow */
body::before{
    content:'';
    position:absolute;
    width:500px;
    height:500px;
    background:#ffd700;
    filter:blur(180px);
    opacity:.15;
    border-radius:50%;
    animation:float 6s ease-in-out infinite;
}

@keyframes float{
    0%,100%{
        transform:translateY(0px);
    }
    50%{
        transform:translateY(-30px);
    }
}

.text{
    position:relative;
    text-align:center;
    z-index:2;
    padding:20px;
}

.text h1{
    font-size:clamp(50px,10vw,140px);
    font-weight:700;
    letter-spacing:8px;
    text-transform:uppercase;

    background:linear-gradient(
        90deg,
        #ffffff,
        #ffd700,
        #ffffff
    );

    background-size:300%;
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;

    animation:shine 5s linear infinite;

    text-shadow:
    0 0 20px rgba(255,255,255,0.15),
    0 0 40px rgba(255,215,0,0.15);
}

.text p{
    margin-top:15px;
    color:#cfcfcf;
    font-size:18px;
    letter-spacing:4px;
}

@keyframes shine{
    0%{
        background-position:0%;
    }
    100%{
        background-position:300%;
    }
}

/* particles */
span{
    position:absolute;
    width:4px;
    height:4px;
    background:white;
    border-radius:50%;
    opacity:.5;
    animation:particle linear infinite;
}

@keyframes particle{
    from{
        transform:translateY(100vh) scale(0);
    }
    to{
        transform:translateY(-10vh) scale(1);
    }
}
</style>
</head>
<body>

<div class="text">
    <h1>YANG BACA KAYAK ANJING</h1>
    <p>kata galang itu njir</p>
</div>

<script>
for(let i=0;i<60;i++){
    let s=document.createElement('span');

    s.style.left=Math.random()*100+'%';
    s.style.animationDuration=(Math.random()*5+5)+'s';
    s.style.opacity=Math.random();
    s.style.width=s.style.height=(Math.random()*4+2)+'px';

    document.body.appendChild(s);
}
</script>

</body>
</html>
